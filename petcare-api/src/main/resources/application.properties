spring.application.name=petcare-api
server.port=${PORT:8080}

# --- Base de datos (MySQL). Se pueden sobreescribir con variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcare?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:petcare}
spring.datasource.password=${DB_PASSWORD:petcare}

# --- Inicializacion: ejecuta schema.sql y data.sql en cada arranque (son idempotentes) ---
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- JPA: la BD la define schema.sql; Hibernate solo valida que las entidades coincidan ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Santiago

# --- APIs externas (Node) servidas desde un segundo equipo/red ---
# Cambiar localhost por la IP del equipo que ejecuta apis-externas (ej. http://192.168.1.50:4000)
petcare.apis.base-url=${APIS_URL:http://localhost:4000}
petcare.apis.timeout-ms=5000

# --- CORS: origenes del frontend autorizados a consumir esta API ---
petcare.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
